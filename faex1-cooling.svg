<svg viewBox="0 0 680 660" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>FAEX1 exhaust hood — transparent box, machine enclosed</title>
  <desc>Isometric view of a sealed cardboard box drawn as a transparent cube. The FAEX1 sits inverted on the filtered bottom, roughly one third of the box height, with a deep plenum above it. Exhaust leaves the rear I/O panel, passes a probe taped there, and is pulled out by two PWM fans on the lid.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="660" fill="#FFFFFF"/>

  <text x="40" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">Transparent box · exhaust path: rear I/O → probe → lid fans</text>
  <text x="40" y="50" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#5F5E5A">FAEX1 inverted inside · machine occupies about one third of the box height · deep plenum above</text>

  <g stroke="#BA7517" stroke-width="1" fill="none" stroke-dasharray="4 4" opacity="0.75">
    <line x1="250" y1="270" x2="570" y2="270"/>
    <line x1="570" y1="270" x2="570" y2="370"/>
    <line x1="570" y1="370" x2="250" y2="370"/>
    <line x1="250" y1="370" x2="250" y2="270"/>
  </g>

  <polygon points="180,430 390,430 390,465 180,465" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1"/>
  <polygon points="180,430 390,430 460,360 250,360" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"/>
  <polygon points="390,430 460,360 460,395 390,465" fill="#7C7A73" stroke="#2C2C2A" stroke-width="1"/>

  <g stroke="#2C2C2A" stroke-width="0.8" fill="none" opacity="0.5">
    <line x1="188" y1="461" x2="188" y2="455"/><line x1="204" y1="461" x2="204" y2="455"/><line x1="220" y1="461" x2="220" y2="455"/><line x1="236" y1="461" x2="236" y2="455"/><line x1="252" y1="461" x2="252" y2="455"/><line x1="268" y1="461" x2="268" y2="455"/><line x1="284" y1="461" x2="284" y2="455"/><line x1="300" y1="461" x2="300" y2="455"/><line x1="316" y1="461" x2="316" y2="455"/><line x1="332" y1="461" x2="332" y2="455"/><line x1="348" y1="461" x2="348" y2="455"/><line x1="364" y1="461" x2="364" y2="455"/><line x1="380" y1="461" x2="380" y2="455"/>
  </g>

  <g stroke="#F1EFE8" stroke-width="1.4" fill="none" opacity="0.9">
    <line x1="396" y1="438" x2="453" y2="381"/>
    <line x1="396" y1="446" x2="453" y2="389"/>
    <line x1="396" y1="454" x2="453" y2="397"/>
  </g>
  <text x="404" y="442" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" fill="#FFFFFF" opacity="0.95" transform="rotate(-45 404 442)">rear I/O</text>

  <polygon points="150,370 470,370 570,270 250,270" fill="#FAEEDA" fill-opacity="0.28" stroke="#BA7517" stroke-width="1"/>
  <polygon points="470,370 570,270 570,370 470,470" fill="#FAC775" fill-opacity="0.3" stroke="#BA7517" stroke-width="1"/>
  <polygon points="150,370 470,370 470,470 150,470" fill="none" stroke="#BA7517" stroke-width="1"/>

  <line x1="200" y1="320" x2="520" y2="320" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.6"/>
  <ellipse cx="290" cy="320" rx="46" ry="18" fill="#F1EFE8" fill-opacity="0.96" stroke="#5F5E5A" stroke-width="1"/>
  <ellipse cx="290" cy="318" rx="29" ry="11" fill="none" stroke="#888780" stroke-width="1"/>
  <path d="M290 307 L290 329 M278 312 L302 324 M302 312 L278 324" stroke="#888780" stroke-width="1" fill="none"/>
  <ellipse cx="430" cy="320" rx="46" ry="18" fill="#F1EFE8" fill-opacity="0.96" stroke="#5F5E5A" stroke-width="1"/>
  <ellipse cx="430" cy="318" rx="29" ry="11" fill="none" stroke="#888780" stroke-width="1"/>
  <path d="M430 307 L430 329 M418 312 L442 324 M442 312 L418 324" stroke="#888780" stroke-width="1" fill="none"/>

  <path d="M290 318 L290 212" stroke="#D85A30" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M430 318 L430 212" stroke="#D85A30" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <circle cx="447" cy="389" r="5" fill="#E24B4A" stroke="#501313" stroke-width="1"/>
  <path d="M460 398 C486 392 476 350 442 330" stroke="#D85A30" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="496" y="384" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#993C1D">exhaust ↑</text>

  <path d="M300 606 L300 480" stroke="#378ADD" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="300" y="628" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#185FA5" text-anchor="middle">cold air · lint filter · bottom cut-out</text>

  <path d="M462 400 L520 430" stroke="#888780" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
  <circle cx="524" cy="433" r="5" fill="#E24B4A" stroke="#501313" stroke-width="1"/>
  <text x="534" y="428" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#A32D2D">probe at vent</text>

  <rect x="524" y="446" width="80" height="40" rx="4" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"/>
  <text x="564" y="460" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">temp ctrl</text>
  <text x="564" y="474" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">PWM</text>
  <text x="564" y="502" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#993C1D" text-anchor="middle">35–45 °C</text>

  <path d="M144 420 L104 420" stroke="#888780" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
  <text x="100" y="410" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#5F5E5A" text-anchor="end">sealed box</text>
  <text x="100" y="424" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#5F5E5A" text-anchor="end">(reused)</text>

  <path d="M232 400 L196 384" stroke="#888780" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
  <text x="192" y="376" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#5F5E5A" text-anchor="end">FAEX1, inverted</text>
  <text x="192" y="390" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#5F5E5A" text-anchor="end">35 mm tall, grille down</text>

  <text x="252" y="376" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="#5F5E5A">2× SST-FHS80X · 80×38 mm</text>

  <text x="40" y="656" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#888780">Fans chosen for static pressure, not airflow: 50.8 mmH₂O pushes through the filter and a sealed plenum, where a 25 mm case fan (2–3 mmH₂O) stalls.</text>
</svg>
